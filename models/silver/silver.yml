version: 2

models:
# ================
# HUBS
# ================
  - name: hub_fund
    description: "DV Hub for Funds"
    columns:
      - name: hk_fund
        description: "sha256(upper(trim(efront_fund_id)))"
        data_tests: [not_null, unique]
      - name: efront_fund_id
        data_tests: [not_null, unique]

  - name: hub_investor
    description: "DV Hub for Investors"
    columns:
      - name: hk_investor
        description: "sha256(upper(trim(efront_investor_id)))"
        data_tests: [not_null, unique]
      - name: efront_investor_id
        data_tests: [not_null, unique]

# ================
# SATELLITES
# ================

  - name: sat_fund_attributes
    description: "Slowly changing descriptive attributes at fund level"
    columns:
      - name: skey
        description: "sha256(hk_fund || fund_name || fund_currency || fund_investor_presentation_aiv || fund_investor_presentation_aiv_lock_date || fund_investor_presentation_aiv_type_efront || fund_efront_iqid || fund_lock_date)"
        data_tests: [not_null, unique]
      - name: hk_fund
        data_tests:
          - not_null
          - relationships: {to: ref('hub_fund'), field: hk_fund}

  - name: sat_fund_metrics
    description: "Snapshot metrics per fund & as_of_date"
    columns:
      - name: skey
        description: "sha256(as_of_date || metric_currency_code || total_value || nav || tvpi || dpi || irr_gross || irr_net || distributions || contributions || commitments || capital_called || gain_loss || pme_irr_1 || pme_irr_2 || pme_irr_msciaw )"
        data_tests: [not_null, unique]
      - name: hk_fund
        data_tests:
          - not_null
          - relationships: {to: ref('hub_fund'), field: hk_fund}
    data_tests:
       - dbt_utils.expression_is_true:
           name: irr_reasonable_range
           expression: >
             (irr_gross is null or (irr_gross between -100 and 100)) and
             (irr_net is null or (irr_net between -100 and 100))
           config: {severity: warn}





