[pytest]
# Pytest configuration for HV EDP

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database/external services)
    slow: Slow running tests
    dagster: Tests related to Dagster
    dbt: Tests related to dbt

# Coverage
[coverage:run]
source = hv_edp_dagster
omit = 
    */tests/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
