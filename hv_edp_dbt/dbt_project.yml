name: 'hv_edp_dbt'
version: '1.0.0'

require-dbt-version: ">=1.10.0,<1.11.0"

profile: 'hv_edp_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         
  - "target"
  - "dbt_packages"

vars:
  stage_location: ""

models:
  hv_edp_dbt:
    bronze:
      +schema: "bronze"
      +materialized: table
      +meta:
        dagster:
          group:
            "bronze"
    silver:
      +schema: "silver"
      +materialized: incremental
      +meta:
        dagster:
          group:
            "silver"
    gold:
      +schema: "gold"
      +materialized: incremental
      +meta:
        dagster:
          group:
            "gold"
      