version: 2

# =============================================================================
# SEED FILES
# =============================================================================
# Static reference data loaded from CSV files.
# Used for metric definitions and lookups.
# =============================================================================

seeds:
  - name: metric_definitions
    description: >
      Mapping of metric IDs to human-readable names and categories.
      Used for understanding the business logic in aggregation macros.
      
      **Categories:**
      - CONTRIBUTION: Capital contributions
      - DISTRIBUTION: Capital distributions  
      - NAV: Net Asset Value components
      - COMMITMENT: Commitment amounts
      - IRR: IRR calculation inputs
    columns:
      - name: metric_id
        description: Numeric metric identifier from source system
        data_tests: [not_null, unique]
      - name: metric_name
        description: Human-readable metric name
      - name: metric_category
        description: High-level category for grouping
      - name: description
        description: Detailed description of what this metric represents
