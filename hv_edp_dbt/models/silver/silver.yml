version: 2

models:
# ================
# HUBS
# ================
  - name: hub_fund
    description: "DV Hub for Funds"
    columns:
      - name: hk_fund
        description: "sha256(upper(trim(fund_id)))"
        data_tests: [not_null, unique]
      - name: fund_id
        data_tests: [not_null, unique]

  - name: hub_investor
    description: "DV Hub for Investors"
    columns:
      - name: hk_investor
        description: "sha256(upper(trim(investor_id)))"
        data_tests: [not_null, unique]
      - name: investor_id
        data_tests: [not_null, unique]

  - name: hub_portfolio
    description: "DV Hub for Portfolios"
    columns:
      - name: hk_portfolio
        description: "sha256(upper(trim(portfolio_id)))"
        data_tests: [not_null, unique]
      - name: portfolio_id
        data_tests: [not_null, unique]
  
  - name: hub_holding
    description: "DV Hub for Holdings"
    columns: 
      - name: hk_holding
        description: "sha256(upper(trim(holding_id)))"
        data_tests: [not_null, unique]
      - name: holding_id
        data_tests: [not_null]

# ================
# LINKS
# ================


  - name: link_portfolio_fund
    description: "DV Link for Portfolios and Funds"
    columns:
      - name: hk_link
        description: "sha2(hk_portfolio || hk_fund) "
        data_tests: [not_null, unique]

  - name: link_fund_company
    description: "DV Link for Funds and Companies"
    columns:
      - name: hk_link
        description: "sha2(hk_company || hk_fund) "
        data_tests: [not_null, unique]

# ================
# SATELLITES
# ================

  - name: sat_fund_attributes
    description: "Slowly changing descriptive attributes at fund level"
    columns:
      - name: hk_key
        description: "Hashed values for the whole row except load_dt"
        data_tests: [not_null, unique]
      - name: hk_fund
        data_tests:
          - not_null
          - relationships: {to: ref('hub_fund'), field: hk_fund}

  - name: sat_fund_metrics
    description: "Snapshot metrics per fund & as_of_date"
    columns:
      - name: hk_key
        description: "Hashed values for the whole row except load_dt"
        data_tests: [not_null, unique]
      - name: hk_fund
        data_tests:
          - not_null
          - relationships: {to: ref('hub_fund'), field: hk_fund}

  - name: sat_portfolio_metrics
    description: "Snapshot metrics per portfolio & as_of_date"
    columns:
      - name: hk_key
        description: "Hashed values for the whole row except load_dt"
        data_tests: [not_null, unique]
      - name: hk_link
        data_tests:
          - not_null
          - relationships: {to: ref('link_portfolio_fund'), field: hk_link}

  - name: sat_portfolio_attributes
    description: "Slowly changing descriptive attributes at portfolio level"
    columns:
      - name: hk_key
        description: "Hashed values for the whole row except load_dt"
        data_tests: [not_null, unique]
      - name: hk_link
        data_tests:
          - not_null
          - relationships: {to: ref('link_portfolio_fund'), field: hk_link}

  - name: sat_company_attributes
    description: "Slowly changing descriptive attributes at company level"
    columns:
      - name: hk_key
        description: "Hashed values for the whole row except load_dt"
        data_tests: [not_null, unique]
      - name: hk_company
        data_tests:
          - not_null
          - relationships: {to: ref('hub_company'), field: hk_company}

  - name: sat_fund_company_investment_attributes
    description: "Slowly changing descriptive attributes at company fund level"
    columns:
      - name: hk_key
        description: "Hashed values for the whole row except load_dt"
        data_tests: [not_null, unique]
      - name: hk_link
        data_tests:
          - not_null
          - relationships: {to: ref('link_fund_company'), field: hk_link}

  - name: sat_company_metrics
    description: "Snapshot metrics per portfolio & as_of_date"
    columns:
      - name: hk_key
        description: "Hashed values for the whole row except load_dt"
        data_tests: [not_null, unique]
      - name: hk_company
        data_tests:
          - not_null
          - relationships: {to: ref('hub_company'), field: hk_company}

  - name: sat_holding_attributes
    description: "Slowly changing descriptive attributes at holding level"
    columns:
      - name: hk_key
        description: "Hashed values for the whole row except load_dt"
        data_tests: [not_null, unique]
      - name: hk_holding
        data_tests:
          - not_null
          - relationships: {to: ref('hub_holding'), field: hk_holding}
  
  - name: sat_holding_metrics
    description: "Snapshot metrics per holding & as_of_date"
    columns:
      - name: hk_key
        description: "Hashed values for the whole row except load_dt"
        data_tests: [not_null, unique]
      - name: hk_holding
        data_tests:
          - not_null
          - relationships: {to: ref('hub_holding'), field: hk_holding}