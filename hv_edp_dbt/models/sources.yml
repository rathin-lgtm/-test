version: 2

# =============================================================================
# EXTERNAL TABLE SOURCES
# =============================================================================
# Data from Harbourview EDW loaded via Snowflake external tables
# File format: Parquet with date partitioning (year/month/day)
# =============================================================================

_external_table_common: &external_table_common
  file_format: "{{ env_var('ENVIRONMENT') }}_RAW.PARQUET_FILE"
  pattern: ".\\*.parquet$"
  infer_schema: true
  auto_refresh: true
  partitions:
    - name: year
      data_type: string
      expression: "split_part(METADATA$FILENAME, '/', 4)"
    - name: month
      data_type: string
      expression: "split_part(METADATA$FILENAME, '/', 5)"
    - name: day
      data_type: string
      expression: "split_part(METADATA$FILENAME, '/', 6)"


sources:
  - name: raw_from_harborview_edw
    description: >
      Raw data from Harbourview Enterprise Data Warehouse.
      Loaded as Parquet files to Snowflake external stage.
    database: "{{ target.database }}"
    schema: "{{ env_var('ENVIRONMENT') }}_RAW"
    meta:
      source_db: HARBOURVIEW_EDW
      source_file_format: PARQUET
    
    tables:
      # ===========================================================================
      # CALENDAR & REFERENCE DATA
      # ===========================================================================
      - name: calendar
        description: Date dimension with day-level granularity
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/CALENDAR/"
          <<: *external_table_common

      - name: calendar_month
        description: Month-level calendar dimension
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/CALENDAR_MONTH/"
          <<: *external_table_common

      - name: calendar_quarter
        description: Quarter-level calendar dimension
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/CALENDAR_QUARTER/"
          <<: *external_table_common

      - name: currency
        description: Currency reference data
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/CURRENCY/"
          <<: *external_table_common

      # ===========================================================================
      # FUND DIMENSIONS
      # ===========================================================================
      - name: dim_fund
        description: Fund master data including AIVs and fund groups
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/DIM_FUND/"
          <<: *external_table_common

      - name: dim_fund_hierarchy
        description: Fund hierarchy relationships for rollup calculations
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/DIM_FUND_HIERARCHY/"
          <<: *external_table_common

      - name: dim_fund_sub_perspective
        description: Sub-perspective definitions for fund views
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/DIM_FUND_SUB_PERSPECTIVE/"
          <<: *external_table_common

      - name: dim_fund_sub_perspective_primary_fund
        description: Primary fund mapping per sub-perspective
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/DIM_FUND_SUB_PERSPECTIVE_PRIMARY_FUND/"
          <<: *external_table_common

      # ===========================================================================
      # INVESTOR DIMENSIONS
      # ===========================================================================
      - name: dim_investor
        description: Investor/LP master data
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/DIM_INVESTOR/"
          <<: *external_table_common

      # ===========================================================================
      # PORTFOLIO & INVESTMENT DIMENSIONS
      # ===========================================================================
      - name: dim_portfolios
        description: Portfolio master data
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/DIM_PORTFOLIOS/"
          <<: *external_table_common

      - name: dim_holdings
        description: Holdings/positions dimension
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/DIM_HOLDINGS/"
          <<: *external_table_common

      - name: dim_investments
        description: Investment dimension
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/DIM_INVESTMENTS/"
          <<: *external_table_common

      - name: dim_investment_type
        description: Investment type reference data
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/DIM_INVESTMENT_TYPE/"
          <<: *external_table_common

      # ===========================================================================
      # COMPANY DIMENSIONS
      # ===========================================================================
      - name: company
        description: Company master data
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/COMPANY/"
          <<: *external_table_common

      - name: company_broad
        description: Company broad categorization
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/COMPANY_BROAD/"
          <<: *external_table_common

      - name: dim_company_industry_hierarchy
        description: Company industry classification hierarchy
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/DIM_COMPANY_INDUSTRY_HIERARCHY/"
          <<: *external_table_common

      # ===========================================================================
      # OTHER DIMENSIONS
      # ===========================================================================
      - name: dim_manager
        description: Fund manager reference data
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/DIM_MANAGER/"
          <<: *external_table_common

      - name: dim_hv_geography_hierarchy
        description: Geographic hierarchy for reporting
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/DIM_HV_GEOGRAPHY_HIERARCHY/"
          <<: *external_table_common

      - name: dim_type_broad
        description: Broad type classification
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/DIM_TYPE_BROAD/"
          <<: *external_table_common

      - name: stage
        description: Investment stage reference data
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/STAGE/"
          <<: *external_table_common

      - name: global_edw_key_to_iqid
        description: Key mapping between EDW and external systems
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/GLOBAL_EDW_KEY_TO_IQID/"
          <<: *external_table_common

      - name: block_list_fund
        description: Funds to exclude from reporting (manually maintained)
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/BLOCK_LIST_FUND/"
          <<: *external_table_common

      # ===========================================================================
      # FACT TABLES - Sub-perspective
      # ===========================================================================
      - name: fact_fund_sub_perspective_funds
        description: Fund to sub-perspective mapping facts
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/FACT_FUND_SUB_PERSPECTIVE_FUNDS/"
          <<: *external_table_common

      - name: fact_fund_sub_perspective_fund_network_paths
        description: Network path facts for sub-perspective rollups
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/FACT_FUND_SUB_PERSPECTIVE_FUND_NETWORK_PATHS/"
          <<: *external_table_common

      - name: fund_hiers_pct_hist
        description: Historical fund hierarchy percentages
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/FUND_HIERS_PCT_HIST/"
          <<: *external_table_common

      # ===========================================================================
      # FACT TABLES - Transactions (Incremental)
      # ===========================================================================
      - name: fact_investor_transactions
        description: Investor-level transaction facts (incremental)
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/FACT_INVESTOR_TRANSACTIONS/"
          <<: *external_table_common

      - name: fact_investment_transactions_fund_hierarchy
        description: Investment transactions by fund hierarchy (incremental)
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/FACT_INVESTMENT_TRANSACTIONS_FUND_HIERARCHY/"
          <<: *external_table_common

      - name: fact_investment_transactions_fund_hierarchy_monthly
        description: Monthly aggregated investment transactions (incremental)
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/FACT_INVESTMENT_TRANSACTIONS_FUND_HIERARCHY_MONTHLY/"
          <<: *external_table_common

      - name: fact_investor_ownership
        description: Investor ownership facts (incremental)
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/FACT_INVESTOR_OWNERSHIP/"
          <<: *external_table_common

      - name: fact_company_valuation
        description: Company valuation facts (incremental)
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/FACT_COMPANY_VALUATION/"
          <<: *external_table_common

      # ===========================================================================
      # FACT TABLES - IRR
      # ===========================================================================
      - name: fact_irr_investment_fund_hierarchy
        description: IRR calculation inputs by fund hierarchy
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/FACT_IRR_INVESTMENT_FUND_HIERARCHY/"
          <<: *external_table_common

      - name: fact_irr_investor
        description: Investor-level IRR calculation inputs
        external:
          location: "{{ var('stage_location') }}/HARBOURVIEW_EDW/FACT_IRR_INVESTOR/"
          <<: *external_table_common
